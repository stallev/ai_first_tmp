/* ── HOOKS ── */
function useScrolled() {
  const [s, setS] = useState(false);
  useEffect(() => {
    const fn = () => setS(window.scrollY > 8);
    window.addEventListener('scroll', fn, { passive:true }); fn();
    return () => window.removeEventListener('scroll', fn);
  }, []);
  return s;
}

function useReveal() {
  useEffect(() => {
    const reveal = el => {
      if (el.dataset.delay) el.style.transitionDelay = el.dataset.delay;
      el.setAttribute('data-revealed','');
    };
    const ob = new IntersectionObserver(entries =>
      entries.forEach(e => { if (e.isIntersecting) { reveal(e.target); ob.unobserve(e.target); } }),
      { threshold:0.08, rootMargin:'0px 0px -40px 0px' }
    );
    document.querySelectorAll('[data-reveal]').forEach(el => {
      el.getBoundingClientRect().top < window.innerHeight * 1.05 ? reveal(el) : ob.observe(el);
    });
    return () => ob.disconnect();
  }, []);
}

function useCount(target, go) {
  const [n, setN] = useState(0);
  useEffect(() => {
    if (!go) return;
    const dur = 1600, t0 = Date.now();
    const tick = () => {
      const p = Math.min(1, (Date.now()-t0)/dur);
      setN(Math.round((1-Math.pow(1-p,3))*target));
      if (p < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }, [go, target]);
  return n;
}

/* ── TRUST BAR ── */
function TrustBar({ show }) {
  const ref = useRef(null);
  const [vis, setVis] = useState(false);
  useEffect(() => {
    if (!show || !ref.current) return;
    const ob = new IntersectionObserver(([e]) => { if(e.isIntersecting){setVis(true);ob.disconnect();} }, {threshold:0.4});
    ob.observe(ref.current);
    return () => ob.disconnect();
  }, [show]);
  const c1=useCount(200,vis), c2=useCount(10000,vis), c3=useCount(98,vis), c4=useCount(49,vis);
  if (!show) return null;
  return (
    <div className="bg-primary-hover" ref={ref}>
      <div className="max-w-[1280px] mx-auto px-14 grid grid-cols-2 md:grid-cols-4">
        {[[`${c1}+`,"Certified Trainers"],[`${c2.toLocaleString('en-US')}+`,"Sessions Booked"],[`${c3}%`,"Client Satisfaction"],[`${(c4/10).toFixed(1)}★`,"Average Rating"]].map(([n,l])=>(
          <div key={l} className="py-9 px-5 text-center border-r border-white/10 last:border-r-0">
            <span className="font-display text-[46px] text-white block leading-none tracking-tight mb-1.5">{n}</span>
            <span className="text-[13px]" style={{color:'rgba(255,255,255,0.5)'}}>{l}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ── APP ── */
function App() {
  const [tweaks, setTweaks] = useState(TWEAKS);
  const [panelOpen, setPanelOpen] = useState(false);
  useReveal();

  function set(key, val) {
    setTweaks(prev => ({...prev,[key]:val}));
    window.parent.postMessage({type:'__edit_mode_set_keys',edits:{[key]:val}},'*');
  }

  useEffect(() => {
    const handler = e => {
      if (e.data?.type==='__activate_edit_mode')   setPanelOpen(true);
      if (e.data?.type==='__deactivate_edit_mode') setPanelOpen(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({type:'__edit_mode_available'},'*');
    return () => window.removeEventListener('message', handler);
  }, []);

  // Apply dynamic primary color via CSS variable override
  useEffect(() => {
    document.documentElement.style.setProperty('--color-primary', tweaks.primaryColor);
  }, [tweaks.primaryColor]);

  return (
    <>
      <Nav/>
      <Hero variant={tweaks.heroVariant}/>
      <TrustBar show={tweaks.showTrustBar}/>
      <HowItWorks/>
      <Disciplines/>
      <FeaturedTrainers/>
      <Testimonials/>
      <ForTrainers/>
      <FAQ/>
      <FinalCTA/>
      <Footer/>
      {panelOpen && (
        <TweaksPanel t={tweaks} set={set} onClose={()=>{
          setPanelOpen(false);
          window.parent.postMessage({type:'__edit_mode_dismissed'},'*');
        }}/>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
