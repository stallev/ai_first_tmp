/* ────────────────────────────────────────────────────────────────────────── */
/*  PRIMITIVES — Button, Card, Badge, Input, Avatar, Rating, Tabs             */
/* ────────────────────────────────────────────────────────────────────────── */

const cn = (...xs) => xs.filter(Boolean).join(" ");

const Button = ({ variant = "filled", size = "md", className = "", as: As = "button", children, ...rest }) => {
  const base = "inline-flex items-center justify-center gap-2 rounded-full font-medium transition-[transform,background-color,box-shadow,border-color] duration-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary/40 focus-visible:ring-offset-2 focus-visible:ring-offset-bg disabled:pointer-events-none disabled:opacity-40 active:scale-[0.97] select-none";
  const variants = {
    filled: "bg-primary text-white hover:bg-primary-hover hover:shadow-[0_2px_10px_rgba(26,48,40,0.35)]",
    tonal: "bg-primary-container text-on-primary-container hover:bg-[#D4E5DA]",
    outlined: "border border-surface-dim bg-transparent text-primary hover:bg-primary-container/60",
    ghost: "text-primary hover:bg-primary-container/60",
    neutral: "bg-surface-variant text-ink hover:bg-surface-container",
    destructive: "bg-error text-white hover:brightness-95 hover:shadow-[0_2px_10px_rgba(178,58,58,0.35)]",
  };
  const sizes = {
    sm: "h-9 px-4 text-[13px]",
    md: "h-11 px-5 text-[14px]",
    lg: "h-12 px-6 text-[15px]",
    icon: "h-10 w-10 p-0",
    "icon-sm": "h-8 w-8 p-0",
  };
  return <As className={cn(base, variants[variant], sizes[size], className)} {...rest}>{children}</As>;
};

const Card = ({ variant = "elevated", className = "", children, ...rest }) => {
  const v = {
    elevated: "bg-surface rounded-2xl shadow-[0_1px_2px_rgba(26,48,40,0.08)]",
    filled: "bg-surface-variant rounded-2xl",
    outlined: "bg-surface rounded-2xl border border-surface-dim",
  }[variant];
  return <div className={cn(v, className)} {...rest}>{children}</div>;
};

const Badge = ({ status = "neutral", className = "", children, icon }) => {
  const map = {
    confirmed: "bg-success-container text-success",
    completed: "bg-surface-variant text-ink-2",
    cancelled: "bg-error-container text-error",
    pending: "bg-warning-container text-warning",
    verified: "bg-primary-container text-on-primary-container",
    info: "bg-info-container text-info",
    no_show: "bg-error-container/60 text-error",
    neutral: "bg-surface-variant text-ink-2",
  };
  return (
    <span className={cn("inline-flex items-center gap-1 rounded-full px-2.5 py-0.5 text-[12px] font-medium leading-5", map[status], className)}>
      {icon}{children}
    </span>
  );
};

const Field = ({ label, hint, error, children, className = "" }) => (
  <label className={cn("block", className)}>
    {label && <span className="mb-1.5 block text-[13px] font-medium text-ink-2">{label}</span>}
    {children}
    {(hint || error) && (
      <span className={cn("mt-1.5 block text-[12px]", error ? "text-error" : "text-ink-2")}>{error || hint}</span>
    )}
  </label>
);

const Input = ({ className = "", error, ...rest }) => (
  <input
    {...rest}
    className={cn(
      "w-full h-12 rounded-lg border bg-surface px-3.5 text-[15px] text-ink placeholder:text-ink-3",
      "focus:outline-none focus:ring-1 transition-colors",
      error ? "border-error focus:border-error focus:ring-error/30" : "border-surface-dim focus:border-primary focus:ring-primary/30 hover:border-ink-2",
      className,
    )}
  />
);

const Textarea = ({ className = "", rows = 4, ...rest }) => (
  <textarea rows={rows} {...rest}
    className={cn(
      "w-full rounded-lg border border-surface-dim bg-surface px-3.5 py-3 text-[15px] text-ink placeholder:text-ink-3",
      "focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary/30 hover:border-ink-2 transition-colors resize-none",
      className,
    )}
  />
);

const Avatar = ({ name = "?", size = "md", src, className = "" }) => {
  const sz = { xs:"h-6 w-6 text-[10px]", sm:"h-8 w-8 text-xs", md:"h-10 w-10 text-sm", lg:"h-14 w-14 text-base", xl:"h-20 w-20 text-xl", "2xl":"h-28 w-28 text-2xl" }[size];
  const initials = name.split(" ").map(s=>s[0]).slice(0,2).join("").toUpperCase();
  return (
    <div className={cn("relative inline-flex shrink-0 items-center justify-center rounded-full bg-primary-container text-on-primary-container font-semibold select-none overflow-hidden", sz, className)}>
      {src ? <img src={src} alt="" className="h-full w-full object-cover"/> : initials}
    </div>
  );
};

const PhotoSlot = ({ label, className = "", aspect = "1/1", icon }) => (
  <div className={cn("relative overflow-hidden rounded-2xl bg-surface-variant", className)} style={{ aspectRatio: aspect }}>
    <div className="absolute inset-0 opacity-50" style={{ backgroundImage: "repeating-linear-gradient(45deg, transparent 0 8px, rgba(45,90,64,0.07) 8px 9px)" }} />
    <div className="absolute inset-0 flex flex-col items-center justify-center gap-2 text-ink-3">
      <span className="text-primary/70">{icon || <I.Camera size={28} stroke={1.5}/>}</span>
      <span className="font-mono text-[11px] tracking-wide">{label}</span>
    </div>

function ScheduleGrid({ onPick }) {
  const days = ["Mon 20", "Tue 21", "Wed 22", "Thu 23", "Fri 24", "Sat 25", "Sun 26"];
  const slots = ["07:00","08:30","10:00","11:30","13:00","15:00","17:30","19:00","20:30"];
  const free = (d, s) => (d + s).length % 3 !== 0;
  const [activeDay, setActiveDay] = useState(0);
  return (
    <Card className="p-4">
      <div className="flex items-center justify-between mb-3">
        <h3 className="font-display text-[18px]">This week</h3>
        <div className="text-[11px] text-ink-2 font-mono">UTC−5</div>
      </div>
      <div className="flex gap-2 overflow-x-auto no-scrollbar -mx-4 px-4 pb-1">
        {days.map((d,i) => (
          <button key={i} onClick={() => setActiveDay(i)}
            className={cn("shrink-0 flex flex-col items-center justify-center h-16 w-14 rounded-2xl border text-center transition-colors",
              activeDay === i ? "bg-primary text-white border-primary" : "bg-surface border-surface-dim text-ink-2 hover:bg-surface-variant")}>
            <span className="text-[11px] uppercase">{d.split(" ")[0]}</span>
            <span className="font-display text-[18px] leading-tight">{d.split(" ")[1]}</span>
          </button>
        ))}
      </div>
      <div className="mt-4 grid grid-cols-3 gap-2">
        {slots.map(s => {
          const ok = free(activeDay, s);
          return (
            <button key={s} disabled={!ok} onClick={onPick}
              className={cn("h-11 rounded-lg text-[13px] font-mono transition-colors",
                ok ? "bg-surface border border-surface-dim text-ink hover:border-primary hover:text-primary"
                   : "bg-surface-container text-ink-3 cursor-not-allowed line-through")}>
              {s}
            </button>
          );
        })}
      </div>
    </Card>
  );
}

            <div className="flex items-center justify-between">

                <div className="text-[12px] text-error">Blocked · vacation</div>
              </div>
              <Button variant="ghost" size="icon-sm"><I.Trash size={16}/></Button>

          <Button variant="tonal" className="w-full"><I.Plus size={16}/> Add exception</Button>

function CalendarMini({ blocked = [] }) {
  const days = Array.from({ length: 35 }, (_, i) => i - 3);
  return (
    <div className="grid grid-cols-7 gap-1 text-center">
      {["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d => (
        <div key={d} className="text-[11px] font-medium text-ink-3 pb-1">{d}</div>
      ))}
      {days.map((d, i) => {
        if (d < 1 || d > 31) return <div key={i}/>;
        const isBlocked = blocked.includes(d);
        const isToday = d === 20;
        return (
          <button key={i}
            className={cn("h-9 w-9 mx-auto rounded-full text-[12.5px] transition-colors",
              isBlocked ? "bg-error-container text-error line-through" :
              isToday   ? "bg-primary text-white font-semibold" :
                          "hover:bg-surface-variant text-ink"
            )}>{d}</button>
        );
      })}
    </div>
  );
}

function VideoSession() {
  const { selectedTrainer, goBack, setScreen, toast } = useApp();
  const t = useT();
  const trainer = trainerById(selectedTrainer) || TRAINERS[0];
  const [muted, setMuted] = useState(false);
  const [cameraOff, setCameraOff] = useState(false);
  const [chatOpen, setChatOpen] = useState(false);
  const [elapsed, setElapsed] = useState(0);
  const [input, setInput] = useState("");
  const [messages, setMessages] = useState([
    { id:1, from:"trainer", text:"Hi! Ready to start?", time:"19:00" },
    { id:2, from:"me",      text:"Yes, just adjusting the mat.", time:"19:01" },
    { id:3, from:"trainer", text:"Take your time. Today we’ll focus on hip mobility and the lower back.", time:"19:01" },
  ]);

  useEffect(() => {
    const id = setInterval(() => setElapsed(e => e + 1), 1000);
    return () => clearInterval(id);
  }, []);

  const mm = String(Math.floor(elapsed/60)).padStart(2,"0");
  const ss = String(elapsed%60).padStart(2,"0");

  const send = () => {
    if (!input.trim()) return;
    setMessages(m => [...m, { id:Date.now(), from:"me", text:input.trim(), time:`${mm}:${ss}` }]);
    setInput("");
  };

  const endCall = () => {
    toast("Session ended");
    setScreen("c.bookings");
  };

  return (
    <div className="-mx-4 -mt-4 md:-mx-6 md:-mt-6 lg:-mx-8">
      <div className="md:grid md:grid-cols-[1fr_360px] lg:grid-cols-[1fr_400px] md:gap-0 bg-[#0E1814] text-white min-h-[calc(100dvh-3.5rem-72px)] md:min-h-[calc(100dvh-4rem)] md:rounded-3xl md:overflow-hidden md:mx-2 md:my-2">
        {/* Video area */}
        <div className="relative flex flex-col">
          {/* Top bar */}
          <div className="absolute top-0 inset-x-0 z-10 flex items-center justify-between p-3 md:p-4 bg-gradient-to-b from-black/50 to-transparent">
            <button onClick={goBack} className="h-9 w-9 inline-flex items-center justify-center rounded-full bg-black/30 backdrop-blur text-white hover:bg-black/50">
              <I.ChevronLeft size={20}/>
            </button>
            <div className="flex items-center gap-2 px-3 py-1.5 rounded-full bg-black/30 backdrop-blur">
              <span className="h-2 w-2 rounded-full bg-[#FF5C5C] animate-pulse"/>
              <span className="font-mono text-[12px] tabular-nums">{mm}:{ss}</span>
              <span className="text-[11px] text-white/70 hidden sm:inline">· {t("Connected")}</span>
            </div>
            <button onClick={() => setChatOpen(!chatOpen)} className="md:hidden relative h-9 w-9 inline-flex items-center justify-center rounded-full bg-black/30 backdrop-blur text-white hover:bg-black/50">
              <I.MessageSquare size={18}/>
              <span className="absolute top-1.5 right-1.5 h-2 w-2 rounded-full bg-primary-light"/>
            </button>
          </div>

          {/* Main video (trainer's feed placeholder) */}
          <div className="flex-1 relative flex items-center justify-center min-h-[320px] md:min-h-[480px]">
            <div className="absolute inset-0" style={{
              backgroundImage: "radial-gradient(ellipse at 50% 30%, #1F3A2A 0%, #0E1814 70%), repeating-linear-gradient(45deg, transparent 0 24px, rgba(255,255,255,0.015) 24px 25px)",
            }}/>
            <div className="relative flex flex-col items-center gap-4">
              <Avatar name={trainer.name} size="2xl" className="ring-4 ring-white/10"/>
              <div className="text-center space-y-2">
                <div className="font-display text-[22px] md:text-[28px] leading-tight">{trainer.name}</div>
                <div className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-white/10 backdrop-blur text-[10.5px] text-white/80 font-mono uppercase tracking-wider">
                  <span className="h-1.5 w-1.5 rounded-full bg-[#6EE7A0]"/> camera on
                </div>
              </div>
            </div>
            {/* Self preview */}
            <div className="absolute bottom-3 right-3 md:bottom-6 md:right-6 w-20 h-28 md:w-36 md:h-48 rounded-2xl overflow-hidden shadow-[0_4px_16px_rgba(0,0,0,0.4)] border-2 border-white/20" style={{
              background: "linear-gradient(135deg, #243329, #1A2820)",
            }}>
              {cameraOff ? (
                <div className="absolute inset-0 flex flex-col items-center justify-center gap-1 text-white/60">
                  <I.Camera size={20}/>
                  <span className="text-[10px] font-mono">CAMERA OFF</span>
                </div>
              ) : (
                <div className="absolute inset-0 flex items-center justify-center">
                  <Avatar name="Alyona Sokolova" size="md" className="ring-2 ring-white/20 md:!h-14 md:!w-14"/>
                </div>
              )}
              <div className="absolute bottom-1.5 left-1.5 text-[10px] font-medium bg-black/40 backdrop-blur px-1.5 py-0.5 rounded-md">You</div>
            </div>
          </div>

          {/* Control bar */}
          <div className="relative z-10 flex items-center justify-center gap-2 md:gap-3 p-4 md:p-6 bg-gradient-to-t from-black/60 to-transparent">
            <button onClick={() => setMuted(!muted)}
              className={cn("relative h-12 w-12 md:h-14 md:w-14 inline-flex items-center justify-center rounded-full transition-colors",
                muted ? "bg-white text-[#0E1814]" : "bg-white/15 text-white hover:bg-white/25")}
              title={t("Mute")}>
              <I.Mic size={20}/>
              {muted && <span className="absolute h-[1.5px] w-7 bg-error rotate-45"/>}
            </button>
            <button onClick={() => setCameraOff(!cameraOff)}
              className={cn("h-12 w-12 md:h-14 md:w-14 inline-flex items-center justify-center rounded-full transition-colors",
                cameraOff ? "bg-white text-[#0E1814]" : "bg-white/15 text-white hover:bg-white/25")}
              title={t("Camera")}>
              <I.Camera size={20}/>
            </button>
            <button onClick={endCall}
              className="h-12 md:h-14 px-5 md:px-7 inline-flex items-center gap-2 rounded-full bg-[#FF5C5C] text-white font-medium hover:bg-[#E04545] transition-colors text-[13px] md:text-[14px]">
              <I.PhoneOff size={18}/>
              <span className="hidden sm:inline">{t("End session")}</span>
            </button>
            <button onClick={() => setChatOpen(!chatOpen)}
              className={cn("hidden md:inline-flex h-12 w-12 md:h-14 md:w-14 items-center justify-center rounded-full transition-colors",
                chatOpen ? "bg-white text-[#0E1814]" : "bg-white/15 text-white hover:bg-white/25")}
              title={t("Chat")}>
              <I.MessageSquare size={20}/>
            </button>
            <button className="h-12 w-12 md:h-14 md:w-14 inline-flex items-center justify-center rounded-full bg-white/15 text-white hover:bg-white/25 transition-colors">
              <I.Settings size={20}/>
            </button>
          </div>
        </div>

        {/* Chat panel (desktop side, mobile sheet) */}
        <aside className="hidden md:flex bg-[#1A2820] text-white border-l border-white/10 flex-col">
          <ChatPanel messages={messages} input={input} setInput={setInput} send={send} t={t}/>
        </aside>
      </div>

      {/* Mobile chat sheet */}
      {chatOpen && (
        <div className="md:hidden fixed inset-0 z-50 flex items-end">
          <div className="absolute inset-0 bg-black/50" onClick={() => setChatOpen(false)}/>
          <div className="relative w-full bg-[#1A2820] text-white rounded-t-3xl max-h-[75vh] flex flex-col animate-[slideUp_.25s_cubic-bezier(0,0,0,1)]">
            <div className="flex items-center justify-between px-4 py-3 border-b border-white/10">
              <h3 className="font-display text-[18px]">{t("Chat")}</h3>
              <button onClick={() => setChatOpen(false)} className="h-9 w-9 inline-flex items-center justify-center rounded-full hover:bg-white/10">
                <I.X size={18}/>
              </button>
            </div>
            <ChatPanel messages={messages} input={input} setInput={setInput} send={send} t={t}/>
          </div>
        </div>
      )}
    </div>
  );
}

function ChatPanel({ messages, input, setInput, send, t }) {
  const scrollRef = useRef(null);
  useEffect(() => {
    scrollRef.current?.scrollTo({ top: scrollRef.current.scrollHeight });
  }, [messages]);
  return (
    <div className="flex-1 flex flex-col min-h-0">
      <div ref={scrollRef} className="flex-1 overflow-y-auto p-4 space-y-3">
        {messages.map(m => (
          <div key={m.id} className={cn("flex", m.from === "me" ? "justify-end" : "justify-start")}>
            <div className={cn(
              "max-w-[80%] px-3 py-2 rounded-2xl text-[13.5px] leading-snug",
              m.from === "me" ? "bg-primary text-white rounded-br-sm" : "bg-white/10 text-white rounded-bl-sm"
            )}>
              {m.text}
              <div className="text-[10px] opacity-60 mt-0.5 font-mono">{m.time}</div>
            </div>
          </div>
        ))}
      </div>
      <form onSubmit={e => { e.preventDefault(); send(); }} className="p-3 border-t border-white/10 flex items-center gap-2">
        <input value={input} onChange={e => setInput(e.target.value)} placeholder={t("Type a message…")}
          className="flex-1 h-11 px-4 rounded-full bg-white/10 text-white placeholder-white/40 text-[13.5px] focus:outline-none focus:bg-white/15"/>
        <button type="submit" disabled={!input.trim()}
          className="h-11 w-11 inline-flex items-center justify-center rounded-full bg-primary text-white hover:bg-primary-hover disabled:opacity-30 disabled:pointer-events-none">
          <I.Send size={18}/>
        </button>
      </form>
    </div>
  );
}

function ScreenRouter() {
  const { screen } = useApp();
  switch (screen) {
    case "c.home":      return <ClientHome/>;
    case "c.catalog":   return <ClientCatalog/>;
    case "c.trainer":   return <TrainerProfile/>;
    case "c.book":      return <BookingFlow/>;
    case "c.session":   return <VideoSession/>;
    case "c.bookings":  return <ClientBookings/>;
    case "c.profile":   return <ClientProfileScreen/>;
    case "t.home":      return <TrainerHome/>;
    case "t.schedule":  return <TrainerSchedule/>;
    case "t.services":  return <TrainerServices/>;
    case "t.clients":   return <TrainerClients/>;
    case "t.income":    return <TrainerIncome/>;
    case "a.home":      return <AdminHome/>;
    case "a.trainers":  return <AdminTrainers/>;
    case "a.complaints":return <AdminComplaints/>;
    case "a.refunds":   return <AdminRefunds/>;
    default: return <ClientHome/>;
  }
}

/* ────────────────────────────────────────────────────────────────────────── */
/*  APP                                                                       */
/* ────────────────────────────────────────────────────────────────────────── */

function App() {
  const [role, setRole] = useState("client");
  const [screen, setScreen] = useState("c.home");
  const [history, setHistory] = useState([]);
  const [selectedTrainer, setSelectedTrainer] = useState("t1");
  const [toastMsg, setToastMsg] = useState(null);
  const [notifOpen, setNotifOpen] = useState(false);
  const [lang, setLangRaw] = useState(() => {
    try { return localStorage.getItem("pulse.lang") || "en"; } catch { return "en"; }
  });
  const setLang = useCallback((l) => {
    setLangRaw(l);
    try { localStorage.setItem("pulse.lang", l); } catch {}
  }, []);
  const [theme, setThemeRaw] = useState(() => {
    if (typeof window !== "undefined") {
      const saved = localStorage.getItem("pulse.theme");
      if (saved) return saved;
      return window.matchMedia?.("(prefers-color-scheme: dark)")?.matches ? "dark" : "light";
    }
    return "light";
  });
  const toastTimer = useRef();

  const setTheme = useCallback((t) => {
    setThemeRaw(t);
    try { localStorage.setItem("pulse.theme", t); } catch {}
  }, []);

  useEffect(() => {
    document.documentElement.classList.toggle("dark", theme === "dark");
    document.documentElement.style.colorScheme = theme;
  }, [theme]);

  const toast = useCallback((msg) => {
    setToastMsg(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToastMsg(null), 2200);
  }, []);

  const setScreenWithHistory = useCallback((s) => {
    setHistory(h => [...h, screen]);
    setScreen(s);
  }, [screen]);

  const goBack = useCallback(() => {
    setHistory(h => {
      if (h.length === 0) { setScreen(defaultScreen(role)); return []; }
      const prev = h[h.length - 1];
      setScreen(prev);
      return h.slice(0, -1);
    });
  }, [role]);

  const openTrainer = useCallback((id) => {
    setSelectedTrainer(id);
    setScreenWithHistory("c.trainer");
  }, [setScreenWithHistory]);

  const ctx = {
    role, setRole,
    screen, setScreen: setScreenWithHistory,
    selectedTrainer, setSelectedTrainer,
    openTrainer, goBack, toast,
    theme, setTheme,
    notifOpen, setNotifOpen,
  };

  return (
    <LangCtx.Provider value={{ lang, setLang }}>
    <AppCtx.Provider value={ctx}>
      <div className="min-h-dvh bg-bg flex flex-col">
        <RoleSwitcher/>
        <div className="flex-1 md:flex md:max-w-[1400px] md:w-full md:mx-auto md:px-4 lg:px-6">
          <SideNav/>
          <main className="flex-1 min-w-0 mx-auto md:mx-0 w-full max-w-md md:max-w-none px-4 md:px-6 lg:px-8 pt-4 md:pt-6 pb-6">
            <ScreenRouter/>
          </main>
        </div>
        <BottomNav/>
        <Toast msg={toastMsg}/>
        <NotificationsPopover/>
      </div>
    </AppCtx.Provider>
    </LangCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
